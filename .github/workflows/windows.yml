name: Windows native build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Validate TypeScript and web build
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust unit and proxy protocol tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build native Windows application and NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Codex Recovery Manager ${{ github.ref_name }}
          releaseBody: |
            Native Tauri 2 / Rust Windows application. Includes in-process Responses API retry proxy, graphical management and tray mode.
            The application does not include any user's provider URLs or credentials.
          releaseDraft: true
          prerelease: true
      - name: Upload portable executable and NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: codex-recovery-manager-windows-x64
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/target/release/codex-recovery-manager.exe
            src-tauri/target/release/bundle/nsis/*.exe
